---

stages:
  - build
  - test
  - trigger
  - build-secondary

variables:
  LIBOSMIUM_STABLE_VERSION: v2.23.1
  NLOHMANN_STABLE_VERSION: v3.11.3
  PROTOZERO_STABLE_VERSION: v1.8.2
  DEBIAN_FRONTEND: "noninteractive"
  DEBIAN_PKG_ESSENTIAL: "git ca-certificates build-essential cmake cmake-data libboost-program-options-dev zlib1g-dev libbz2-dev libexpat1-dev liblz4-dev libspatialite-dev libgdal-dev libyaml-cpp-dev"
  DEBIAN_PKG_GIT: "nlohmann-json3-dev libosmium2-dev libprotozero-dev"

build:trixie:git:stable:
  image: amd64/debian:trixie
  stage: build-secondary
  variables:
    GIT_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.zz.de
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy ${DEBIAN_PKG_ESSENTIAL}
    - git config --global url."${GIT_BASE}/mirror".insteadOf https://github.com
    - git clone ${GIT_BASE}/mirror/osmcode/libosmium.git --branch ${LIBOSMIUM_STABLE_VERSION}
    - git clone ${GIT_BASE}/mirror/nlohmann-json --branch ${NLOHMANN_STABLE_VERSION}
    - git clone ${GIT_BASE}/mirror/protozero --branch ${PROTOZERO_STABLE_VERSION}
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build

build:trixie:packages:
  image: amd64/debian:trixie
  stage: build
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy ${DEBIAN_PKG_ESSENTIAL} ${DEBIAN_PKG_GIT}
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build
  artifacts:
    paths:
      - build
      - rules

test:trixie:package:
  image: amd64/debian:trixie
  stage: test
  needs:
    - build:trixie:packages
  script:
    - apt-get update
    - apt-get install s3cmd
    - apt-get -fy install --no-install-recommends --no-install-suggests libboost-program-options1.83.0 libgdal36 sqlite3 libyaml-cpp0.8 s3cmd
    - cp ${S3_CFG} ~/.s3cfg
    - s3cmd get s3://osm/pbf/kreisgt.pbf
    - build/wayproblems -i kreisgt.pbf -o kreisgt.sqlite -r rules/rules-de.yaml -r rules/rules.yaml

trigger:osmprocess:wayproblems:
  stage: trigger
  needs:
    - job: build:trixie:packages
      artifacts: false
    - job: test:trixie:package
      artifacts: false
  trigger:
    project: osm/process/wayproblems

build:trixie:git:latest:
  image: amd64/debian:trixie
  stage: build-secondary
  variables:
    GIT_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.zz.de
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy ${DEBIAN_PKG_ESSENTIAL}
    - git config --global url."${GIT_BASE}/mirror".insteadOf https://github.com
    - git clone ${GIT_BASE}/mirror/libosmium
    - git clone ${GIT_BASE}/mirror/nlohmann-json
    - git clone ${GIT_BASE}/mirror/protozero
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build

build:sid:packages:
  image: amd64/debian:sid
  stage: build-secondary
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy ${DEBIAN_PKG_ESSENTIAL} ${DEBIAN_PKG_GIT}
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build

build:sid:git:latest:
  image: amd64/debian:sid
  stage: build-secondary
  variables:
    GIT_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.zz.de
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy ${DEBIAN_PKG_ESSENTIAL}
    - git config --global url."${GIT_BASE}/mirror".insteadOf https://github.com
    - git clone ${GIT_BASE}/mirror/libosmium
    - git clone ${GIT_BASE}/mirror/nlohmann-json
    - git clone ${GIT_BASE}/mirror/protozero
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build
